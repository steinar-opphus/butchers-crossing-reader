      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Shape and paint</h2><p>The expedition&#x27;s long, shallow wagon curves downward at the center. Faded blue paint remains on its sides and red traces on the massive wheel spokes.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Preparing the team</h2><p>Miller says some oxen are unbroken and a couple need shoeing, although he praises the lead team. Schneider disputes Miller&#x27;s estimates of their daily speed.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>On the trail</h2><p>Hoge drives the loaded wagon on the expedition. When saddle pain drives Andrews to try its seat, he finds the hard wood and dust still less comfortable and returns to his horse.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Carrying water across the dry country</h2><p>Miller fashions a temporary canvas-and-sapling tank in the wagon. Watering the animals reduces it to a quarter full at the first dry camp; the next watering empties it, with the last folds drained into a keg. The outfit has eight oxen and three horses.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>The load and the mountain road</h2><p>Schneider urges unloading ammunition during the water crisis; Miller refuses. Later Hoge must back and angle the wagon around a sharp mountain turn beside a deep gully.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Hide collection and abandonment</h2><p>Hoge uses the wagon to collect dried skins, which the men bind into stacks of 75 to 90. During the blizzard Miller orders it abandoned because it slows their return to camp; the oxen are unyoked.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>The towering load</h2><p>The wagon survives winter with warped boards and rust. Eighteen hide bales are loaded ten or twelve feet above its seat, despite Schneider&#x27;s warning that it will tip. Three men steady it with ropes during the descent.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Destroyed in the river</h2><p>A floating log and Schneider&#x27;s fallen horse strike the wagon during the crossing. It overturns, drags the oxen away, breaks against rocks and loses its hide load in the current.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 13</summary><p><a href="assets/33819d6e12312c.jpg">Open noncanonical illustration</a></p><p>An interpretation of the towering hide load prepared for the descent.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 5</summary><p><a href="assets/f242844f230893.jpg">Open noncanonical illustration</a></p><p>The outfit returns from Ellsworth in a cloud of dust.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/324d9c9532fcb0.jpg">Open noncanonical illustration</a></p><p>Miller uses the remaining water to wet an ox mouth while Andrews and Schneider hold its horns.</p></details></noscript>
