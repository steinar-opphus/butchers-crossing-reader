      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Introduction</h2><p>Francine is a woman Andrews meets at Jackson’s Saloon, where Miller identifies her as a sex worker.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Appearance</h2><p>Francine has a pale, full face, yellow hair, large pale eyes and reddish-blond lashes. She is heavy but moves gracefully; at the saloon meeting she wears a shiny dress with broad blue and white stripes.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>At the saloon table</h2><p>Miller identifies Francine as a sex worker at Jackson&#x27;s Saloon. She says she is not working during the conversation. Hoge condemns her in religious terms.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Morning walks</h2><p>Francine wears a plain gray dress on an early morning when Andrews sees her, her loose hair reddish-gold in the sunlight. She says she enjoys walking alone while mornings are cool and work is quiet, but invites him to accompany her.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>St. Louis and her own room</h2><p>Francine speaks German in her exchange with Schneider. She says she has lived in Butcher&#x27;s Crossing for two years after leaving St. Louis, and prefers life here. Her room contains a carpet she says is the town&#x27;s only one, imported from St. Louis; she plans to obtain a glass window.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>An invitation and a rejection</h2><p>Francine invites Andrews upstairs and tells him she wants him personally, outside her work. She predicts that the hunt will harden and change him. When he recoils and leaves during their intimate encounter, she remains bewildered.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>A changed man returns</h2><p>When Andrews returns, Francine says she believed him dead. Her yellow hair is tightly braided, and small tired lines show at her eyes. She notices his hard hands and older, browner face. He apologizes for leaving her before the expedition; she says he has changed enough to come back. She asks him to stay, distinguishing their relationship from her other encounters, and he joins her in the darkened room.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Five days together</h2><p>Andrews stays with Francine for five days and nights. His attention gradually shifts toward her, but he becomes restless and anticipates leaving her without ever fully knowing her; these are his feelings, not an account of hers.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Money left without a farewell</h2><p>Watching Francine sleep, Andrews feels an unguarded pity and regards his earlier pity as mean. He leaves most of his remaining money for her and departs without waking her. Her response is not shown.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Manner and outlook</h2><p>Francine enjoys quiet morning walks and invites Andrews to join her.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 3</summary><p><a href="assets/a87d4bd79328cd.jpg">Open noncanonical illustration</a></p><p>An interpretation of Francine.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 5</summary><p><a href="assets/4680b31f837b29.jpg">Open noncanonical illustration</a></p><p>An interpretation of the furnishings in the room.</p></details></noscript>
