      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Introduction</h2><p>McDonald recommends Miller as a hunter who has spent most of his life in the country. He says Miller lives by the river and frequents Jackson’s Saloon.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>First meeting and appearance</h2><p>Miller is a large man, wearing a black suit when Andrews meets him. His skin is smooth and slightly yellowed, his mouth wide, and his thick black hair parted at the side.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Independence and experience</h2><p>Miller says he taught himself to read while snowbound in a Colorado trapper&#x27;s shack. He insists he hunts independently and says McDonald has tried for two years to recruit him. His account of McDonald&#x27;s fifty-cent payment for raw hides and dwindling Kansas herds is critical of the local trade.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>A valley kept in reserve</h2><p>Miller tells Andrews that in autumn 1863 he followed a buffalo trail into a secluded mountain valley in Colorado, where he estimated thousands of buffalo with unusually thick fur. He says he has never returned.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Terms of the expedition</h2><p>He proposes a party of four under his command: a hunter, two skinners and a camp man. He recommends oxen that can graze and estimates five or six hundred dollars for equipment and supplies. His proposed shares are sixty percent for himself and forty for Andrews; Miller will provide for Hoge, while Andrews provides for the other skinner.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Terms of the expedition</h2><p>Miller dismisses Hoge&#x27;s refusal to return to Colorado, praises his work as a camp man and predicts there will be no snow before November. After Andrews pays six hundred dollars, Miller plans to buy supplies in Ellsworth and depart in about two weeks, aiming for mid-September in the mountains.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Returning with the outfit</h2><p>Miller returns on the sixth day with the wagon, horses and Fred Schneider. He reports that McDonald will pay four dollars per prime hide. Some oxen still need breaking or shoeing; Miller plans to leave after three or four days of preparation.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Returning with the outfit</h2><p>Schneider challenges Miller&#x27;s optimistic travel rates and agrees only to a fixed wage of sixty dollars a month. Andrews approves, and Miller accepts.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>Leading the first day</h2><p>Miller directs the party across country to the Smoky Hill trail. At midday he estimates nearly eight miles traveled and says the river trail will lead toward Colorado, beyond which they will travel without a trail. He explains measures to protect the oxen and identifies a buffalo watering route.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>Leading the first day</h2><p>He pushes the party onward in the cool evening, then helps the exhausted Andrews with his bedroll at camp.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Signs of the diminished herds</h2><p>Miller interprets the bones, wallow and carcass encountered on the trail, recalling earlier abundance and describing uses of buffalo bone. He despises the small herds now remaining; Schneider answers that hunters must work with what remains.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>At home on the trail</h2><p>Miller grows quiet and attentive to the land. His beard thickens and curls, and Andrews sees an increasing ease in his riding and movement. He advises a struggling family to divert to Fort Wallace rather than continue alone with a lame mule. His contemptuous remarks about Indigenous people they pass are his prejudice, not the wiki&#x27;s judgment.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>A shortcut without water</h2><p>Miller rejects the longer river route and predicts nearby water, but the party camps dry and exhausts its carried supply. He admits a possible missed landmark, then reveals that their course has put the Arkansas much farther away than Schneider supposed. Andrews chooses to continue with him.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>A shortcut without water</h2><p>Miller pools the last canteen water to wet the oxen&#x27;s mouths and refuses to abandon the ammunition load. After they finally find a stream, he locates water at every subsequent day&#x27;s end.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Rediscovering the valley route</h2><p>Railway tracks astonish Miller. At the mountain river he struggles to recognize the old landscape, but eventually finds the crossing and identifies fresh buffalo traffic on an uphill trail. At the pass, he estimates two or three thousand buffalo in the visible portion of the valley.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Planning the valley hunt</h2><p>Miller casts bullets beside the campfire, wearing a fringed buckskin jacket. He sketches the valley on rock with a bullet, estimates its length at twenty or twenty-five miles and claims the buffalo cannot leave except by the hunters&#x27; pass. He plans for Hoge to collect hides by wagon and bale them at the main camp, and says they could remain all winter if necessary.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Refusing to end the stand</h2><p>Miller hunts with a Sharps rifle supported by a forked branch. Once the buffalo circle without fleeing, he continues shooting despite Schneider&#x27;s objections about the skinning workload, threatening to shoot him if he frightens the herd. After the herd breaks away, Miller counts 135 kills. His trigger finger is swollen and his left palm blistered. He and Schneider later eat raw liver and return to skinning at night. Miller stops Schneider&#x27;s intrusive questions to Andrews about Francine.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>The decision to stay</h2><p>Miller becomes withdrawn at camp, and his powder-darkened face haunts Andrews&#x27;s dreams. Eventually he stops washing the residue away. He claims raw liver prevents what he calls buff sickness. When Schneider proposes leaving after two weeks, Miller insists on finishing the herd and promises time before the weather turns. He says he has hunted buffalo for twenty years without learning to predict them.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Shelters in the storm</h2><p>During the blizzard Miller orders the wagon abandoned and the oxen released. He carries Hoge behind him to camp, then lashes hides into emergency shelters. Schneider refuses to join them and makes his own.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Accepting a winter in the valley</h2><p>Miller reports deep snow blocking the pass and estimates six to eight months until thaw. He refuses Schneider directions for a solitary crossing, insisting both that it would kill him and that his help is needed with the wagon and hides. Finding no buffalo, he supposes the survivors escaped during the storm.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>The winter provider</h2><p>Miller reports surviving a previous solitary winter in Wyoming on his horse and a mountain goat. In the valley his strength and endurance increase while his companions weaken. He hunts, cooks and assumes much of Hoge&#x27;s former work, appearing composed and at ease in the isolation. He rations two recovered whisky crocks to Hoge.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Loading the return journey</h2><p>Miller recovers the horses and helps round up all eight oxen. He delays departure because of unstable snow, finally announcing it in late April. The wagon carries eighteen bales; he estimates roughly 1,500 hides aboard and more than 3,000 left behind, worth over $18,000 if prices hold.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>The river disaster</h2><p>Miller tests the river crossing, but a floating log and Schneider&#x27;s fallen horse overturn the wagon. The river carries away the team and hides. Miller tells Andrews that Schneider died on hitting the water and that a search would be futile. The three remaining men ride away.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>A failed market and a broken partnership</h2><p>Back in town, Miller shaves and again has a heavy white face. He describes Schneider&#x27;s death to McDonald as drowning. McDonald confirms the four-dollar agreement but reports a collapsed market and exhausted funds. Miller threatens to return, then tells Andrews their business is finished.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Burning the hide stock</h2><p>Miller pushes hide bales into the fire at McDonald&#x27;s office and sends loaded wagons into the blaze. Hoge identifies it as Miller&#x27;s fire when asked whether he set it. Miller taunts McDonald by riding just beyond his reach, then continues destroying the stock for nearly an hour.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>A scorched departure</h2><p>His face is black with soot, his eyebrows nearly burned away, his hair scorched and his forehead marked by a welt. He rides off as Andrews attempts to speak; his horse catches Andrews&#x27;s shoulder. Hoge follows into the darkness.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Manner and outlook</h2><p>Miller insists on hunting independently rather than leading McDonald’s parties.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 11</summary><p><a href="assets/96124d84e4f9f4.jpg">Open noncanonical illustration</a></p><p>The men shelter in lashed buffalo hides while Schneider keeps apart.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/bfeac3e32a8ca5.jpg">Open noncanonical illustration</a></p><p>Andrews examines buffalo remains with Miller.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 10</summary><p><a href="assets/4ad911d4639e75.jpg">Open noncanonical illustration</a></p><p>Andrews tends the spare rifle beside Miller during the prolonged stand.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 15</summary><p><a href="assets/f7c4b3abaca7eb.jpg">Open noncanonical illustration</a></p><p>Miller faces the others after feeding the hide stock and wagons to the fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 2</summary><p><a href="assets/0abe37524fe862.jpg">Open noncanonical illustration</a></p><p>An interpretation of Miller.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 14</summary><p><a href="assets/0a539ee030871e.jpg">Open noncanonical illustration</a></p><p>Andrews, Miller and Hoge after washing and trimming their hair on returning to town.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 3</summary><p><a href="assets/8dd0d89223abec.jpg">Open noncanonical illustration</a></p><p>Andrews supplies the money for the proposed hunt.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/9a4afa40618967.jpg">Open noncanonical illustration</a></p><p>The hunters see the grassy valley and its great herd from the pass.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 5</summary><p><a href="assets/f242844f230893.jpg">Open noncanonical illustration</a></p><p>The outfit returns from Ellsworth in a cloud of dust.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/324d9c9532fcb0.jpg">Open noncanonical illustration</a></p><p>Miller uses the remaining water to wet an ox mouth while Andrews and Schneider hold its horns.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/c72cedb32cc0d9.jpg">Open noncanonical illustration</a></p><p>The journey changes the riders’ appearance and bearing.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 12</summary><p><a href="assets/0171132522f379.jpg">Open noncanonical illustration</a></p><p>The winter lean-to and improvised hide clothing beside the campfire.</p></details></noscript>
