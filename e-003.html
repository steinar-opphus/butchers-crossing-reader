      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Building</h2><p>Jackson’s Saloon is a long, rectangular, two-story building in Butcher’s Crossing. A long roof overhang shades its front.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Rooms and evening meeting</h2><p>The front room is long and narrow, lit by lanterns suspended from sooty rafters. An adjoining larger room has tables around an open oval space and a staircase at the back.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Rooms and evening meeting</h2><p>Here Andrews meets Miller, Hoge and Francine, and pays six hundred dollars toward Miller&#x27;s proposed hunt.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>The quiet barroom</h2><p>On the hunters&#x27; return, the barroom is deserted and lit by only one lantern.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 3</summary><p><a href="assets/8dd0d89223abec.jpg">Open noncanonical illustration</a></p><p>Andrews supplies the money for the proposed hunt.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/61b867c0223587.jpg">Open noncanonical illustration</a></p><p>An interpretation of the small settlement and its main street.</p></details></noscript>
