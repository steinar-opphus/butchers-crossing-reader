      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>A worn gift</h2><p>Hoge says a traveling preacher in Kansas City gave him this Bible when he was converted. It is a worn cheap edition with torn pages and dark brown stains at some page corners. Hoge identifies the marks as buffalo blood and worries that they may be sacrilegious.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Recovered from the snow</h2><p>Andrews finds the Bible open and soaked in snow and ice. Hoge dries it page by page, then reads its blurred and soiled pages during the winter.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 4</summary><p><a href="assets/a51a474a2f0bba.jpg">Open noncanonical illustration</a></p><p>An interpretation of the worn Bible Hoge shows Andrews.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 12</summary><p><a href="assets/d1701cbcb3bcad.jpg">Open noncanonical illustration</a></p><p>Hoge dries the Bible recovered from the snow.</p></details></noscript>
