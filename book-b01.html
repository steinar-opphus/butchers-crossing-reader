      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Introduction</h2><p>William Andrews arrives by coach in Butcher’s Crossing, seeking J. D. McDonald.</p></details><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Chapter 1</h2><p>William Andrews reaches Butcher’s Crossing by coach from Ellsworth after nearly two weeks of travel. He takes a room at Butchers Hotel and asks about J. D. McDonald, whom the clerk identifies as a hide trader with an office near the brining pits. Andrews plans to visit him the following day.</p></details><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Chapter 1</h2><p>Andrews shaves, bathes and falls asleep before dark. During the night, unfamiliar noises repeatedly wake him; unable to see the room’s walls, he experiences a sense of disorientation.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Chapter 2</h2><p>Will Andrews visits J. D. McDonald with a letter from his father, Benjamin Andrews, a Unitarian lay minister. McDonald remembers the family from Boston, but says his church visits were attempts to obtain a better job. He offers Will work with the paperwork of his buffalo-hide business and urges him to share in the town&#x27;s anticipated growth.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Chapter 2</h2><p>Andrews says he had been in his third year at Harvard and has come west to know the country. Inwardly, he associates the wildness he seeks with freedom, goodness, hope and vigor. He wants to speak with hunters but has not decided whether to join a hunt. McDonald warns him against the hunters, forbids him to join his own parties, and reluctantly recommends Miller, whom he says can probably be found at Jackson&#x27;s Saloon.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Chapter 3</h2><p>At Jackson&#x27;s Saloon, Andrews meets Miller, Charley Hoge and Francine. He says he rejected McDonald&#x27;s offer because he did not want to be tied down. Miller describes himself as an independent hunter and tells Andrews of a secluded Colorado valley where he says thousands of thick-furred buffalo remain.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Chapter 3</h2><p>Miller proposes a four-man expedition under his command. Andrews agrees to help with skinning and to finance the venture, with a proposed forty-percent share against Miller&#x27;s sixty percent. Hoge recounts losing his hand after a Colorado blizzard and resists returning, although Miller insists he will come and predicts no snow before November. Andrews pays six hundred dollars; Miller plans to buy the equipment in Ellsworth and leave for the mountains in about two weeks.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Chapter 4</h2><p>While Miller is away, Andrews watches the town and western horizon from his hotel room and finds his memories of Boston growing remote. Francine invites him on a morning walk. His conversations with Hoge about the latter&#x27;s Bible expose Andrews&#x27;s limited scriptural knowledge and recall his father&#x27;s encouragement to read Emerson.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Chapter 4</h2><p>McDonald already knows about the expedition. He predicts failure and offers Andrews a way out, but Andrews refuses because he has given his word. McDonald then urges him to follow Miller&#x27;s judgment in the country. Walking to the river, Andrews sees the hunt as a means of leaving city life and imagines the water as a boundary between city and wilderness.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Chapter 5</h2><p>Miller returns with the wagon, oxen, horses and Fred Schneider as skinner. Schneider challenges the Colorado venture and Miller&#x27;s travel estimates, then agrees to sixty dollars a month rather than a share. Miller plans to leave in three or four days.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Chapter 5</h2><p>Andrews is angered by Schneider&#x27;s treatment of Francine. She later invites him to her room, rejects his assumption that her life is terrible, and predicts that the hunt will change him. She says she wants him personally, but during their intimate encounter he recalls Schneider&#x27;s words and imagines her other clients. He recoils, apologizes and leaves her bewildered.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>Chapter 6</h2><p>The party leaves at dawn on August 25 with six weeks of provisions. Hoge drives the wagon and the others ride. Miller leads them toward the Smoky Hill, where they stop around midday and water the oxen in pairs. He estimates that they have covered nearly eight miles.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>Chapter 6</h2><p>Andrews, unused to long rides, suffers heat and severe saddle soreness; a trial in the wagon brings no relief. Miller pushes onward into the evening, then helps Andrews at the halt. Hoge digs the fire pit and cooks their meal. After hearing a passing wagon that Miller identifies as probable buffalo hunters, Andrews sleeps.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Chapter 7</h2><p>As the journey continues, Andrews&#x27;s pain gives way to numbness and repetitive camp routine. On the fourth day, Miller shows him buffalo bones and recalls the old large kills. They later pass a wallow and a dead cow, then glimpse a small distant herd. Miller laments diminished herds while Schneider keeps his expectations modest.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Chapter 7</h2><p>The men pass other travelers, including a family whose lame mule prompts Miller to recommend stopping at Fort Wallace. Andrews grows leaner and weathered; he sees Miller becoming more at home in the land, while Schneider grows more withdrawn and Hoge continues reading, drinking and singing. On the sixth day they reach the end of the Smoky Hill Trail.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Chapter 8</h2><p>Miller takes a cross-country shortcut, promising nearby water, but the party camps dry and exhausts the water carried in a canvas tank. Schneider urges a turn toward the Arkansas; Miller says it is now too far away, and Andrews chooses to continue with him. Miller uses the remaining canteen water on the oxen&#x27;s swollen mouths and refuses to unload the ammunition. Andrews becomes intermittently delirious before they finally find a stream after dawn and stop to recover.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Chapter 8</h2><p>They see the mountains on the fourteenth day and reach the foothills four days later. Railway tracks astonish Miller and renew Schneider&#x27;s doubts about the herd. Miller struggles to find the old entrance, then identifies a crossing and a trail he judges to have recent buffalo traffic.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Chapter 8</h2><p>The climb strains the men and wagon. Andrews collapses, learns a slower gait and cuts his palms during the final ascent. At the pass, they see the long grassy valley and a large buffalo herd. Miller estimates two or three thousand in view. They descend to the valley floor before dark.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Chapter 9</h2><p>The hunters establish their valley camp beside a spring. Hoge and Andrews shelter the powder; Andrews and Schneider cut fuel. A great boulder shelters the fire, and branches and pine needles cushion their beds.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Chapter 9</h2><p>Miller casts ammunition while Andrews watches closely. Schneider teaches him to sharpen and use his new knives; Andrews cuts his thumb testing an edge.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Chapter 9</h2><p>Miller sketches the valley, describes its extent and claims the herd cannot escape through another pass. He plans wagon collection and baling at the main camp. Schneider asks for a slow start while Andrews learns; Miller says they could remain all winter if needed.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Chapter 10</h2><p>Miller begins the hunt with Andrews beside him. After killing a scarred bull, he holds a circling herd in a stand and continues shooting. Andrews supplies and cleans his rifles; Schneider protests the growing workload, and Miller threatens him if he frightens the animals.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Chapter 10</h2><p>The herd finally escapes after a wounded cow breaks its circle. Miller counts 135 kills. Andrews is hurt and feels estranged from himself; Miller&#x27;s hands are swollen and blistered.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Chapter 10</h2><p>Schneider demonstrates skinning, but Andrews ruins two hides and is sent back with a calf. With Hoge&#x27;s help he suspends and skins it, then struggles to gut it. Miller and Schneider eat raw liver; Andrews vomits and washes at the spring.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Chapter 10</h2><p>Andrews nevertheless hungers for the cooked meat. Miller stops Schneider&#x27;s questions about Francine before the two return to night work. Alone, Andrews touches his unfamiliar beard and tentatively links his revulsion toward Francine and the slaughtered animal to the loss of the selves he had imagined for them.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Chapter 11</h2><p>The hunt settles into exhausting repetition. Andrews becomes more proficient and less sensitive to slaughter; he kills four buffalo himself and begins eating raw liver after Miller claims it prevents illness. Hoge gathers hides, drinks more and worries at the cold.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Chapter 11</h2><p>Schneider urges departure after two weeks, but Miller insists on finishing the herd and predicts time before bad weather. Andrews pays Schneider sixty dollars. By the twenty-fifth mountain day, fewer than three hundred of roughly five thousand buffalo remain.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Chapter 11</h2><p>After the three riders turn back six rushes, snow arrives and rapidly becomes a blizzard. They abandon the wagon and release the oxen. Andrews is dragged away by the horses, loses his bearings and follows shouts back; Hoge rides behind Miller to camp.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Chapter 11</h2><p>Miller makes hide shelters among the fallen stacks. Schneider angrily refuses to share and makes his own. The storm lasts two days and three nights; under the snow Andrews thinks of Francine as warmth he has rejected.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Chapter 12</h2><p>All four men survive the blizzard. Miller reports the pass blocked by deep snow and estimates six to eight months until thaw. Schneider wants to leave alone, but Miller refuses directions, citing both danger and the need for his labor.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Chapter 12</h2><p>They build a framed hide lean-to and make snow-blinders, snowshoes, boots and robes. Miller finds no buffalo and believes they escaped; food supplies are damaged or dwindling. He hunts and takes over much of Hoge&#x27;s work while seeming increasingly at ease.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Chapter 12</h2><p>Andrews recovers Hoge&#x27;s soaked Bible, which Hoge carefully dries. Schneider withdraws and talks to himself. Andrews revisits his memory of Francine without shame, but an unprotected walk leaves him snow-blind for nearly three days.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Chapter 12</h2><p>Winter passes in work and silence. Schneider counts the days with notches and collects his wages; Andrews pays him while losing any meaningful sense of elapsed time.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Chapter 13</h2><p>Spring thaw brings recovery of the horses, all eight oxen and the wagon. Miller rejects Schneider&#x27;s early route through the snow but finally announces departure in late April.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Chapter 13</h2><p>The men load eighteen bales despite Schneider&#x27;s warning about the height. Miller estimates around 1,500 hides aboard and over 3,000 left behind. Andrews offers Schneider an extra share, which he refuses. Ropes steady the wagon during the descent.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Chapter 13</h2><p>At the swollen mountain river, Andrews and Schneider briefly play in the water. Miller tests a crossing; Andrews crosses first, and Hoge guides the team from a lead ox after Schneider declines the task.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Chapter 13</h2><p>A floating log strikes Schneider&#x27;s horse, which falls and hits his head with a hoof. Horse and log overturn the wagon; the river sweeps away the team and scatters the hides. Miller says Schneider is dead and a search useless. Hoge calls it God&#x27;s will. Andrews notices Schneider&#x27;s trapped hat before the three survivors ride away.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Chapter 14</h2><p>The survivors return in late May to a nearly deserted town. McDonald&#x27;s office is abandoned among hide bales and neglected wagons. At the hotel, Andrews bathes, shaves, cuts his hair and replaces his clothes; Miller shaves too, while Hoge looks markedly gaunt and diminished.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Chapter 14</h2><p>They find McDonald in the bunkhouse. He confirms the old price agreement but says the hide market has collapsed and his money is gone. He reports that the railroad bypasses town by fifty miles. Miller threatens to return, then tells Andrews their business is finished.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Chapter 14</h2><p>McDonald argues that their dreams have left them with nothing. Andrews rejects this judgment without being able to explain what he gained. McDonald plans to leave and offers him work, but Andrews reserves his decision.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Chapter 14</h2><p>Andrews visits Francine, who believed him dead. He apologizes for fleeing her before the expedition; she recognizes the changes in him and asks him to stay. He remains with her.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Chapter 15</h2><p>Andrews spends five days with Francine, first absorbed in intimacy and then increasingly detached and restless. In town he encounters Hoge, who speaks as if the expedition has yet to happen and denies death when reminded of Schneider. Andrews returns shaken and struggles to explain his fears. He anticipates leaving Francine without ever fully knowing her.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Chapter 15</h2><p>A night fire wakes Andrews. Miller is pushing hides into the blaze at McDonald&#x27;s office; Hoge identifies it as Miller&#x27;s fire. Miller drags loaded wagons into it and evades McDonald&#x27;s attempts to strike him. McDonald says the hides mattered because they were his.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Chapter 15</h2><p>After nearly an hour, Miller faces the others with soot-blackened, scorched features, then rides away. His horse strikes Andrews&#x27;s shoulder; Hoge follows Miller into the darkness and McDonald leaves too.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Chapter 16</h2><p>Andrews remains alone at the ruined hide stock until dawn, then returns to sleeping Francine. He feels a different, unguarded pity for her and recognizes vanity in his search for fulfillment through her and the wilderness.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Chapter 16</h2><p>Thinking of his father, he resolves not to return home with McDonald. He leaves most of his remaining money for Francine, keeping two bills, and goes without waking her.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Chapter 16</h2><p>Andrews pays the stableman, retrieves his horse and rides past the burned office and across the river. He enters the open country without a settled destination, expecting to discover it later in the day.</p></details></noscript>
