      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Bones, tracks and living herds</h2><p>Andrews first examines white bones scattered through prairie grass. An almost intact skeleton has a large rib cage and a comparatively small skull with two short upward-curving horns. The party also passes a wallow, a decaying cow and a small herd too distant for Andrews to distinguish individual animals.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Miller&#x27;s account of decline</h2><p>Miller contrasts these signs with his recollection of enormous herds and widespread old kill sites. He says bones can be collected for fertilizer and describes Indigenous uses of bone for tools, ornaments and other objects. These are his accounts.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>The herd in the mountain valley</h2><p>Beyond the pass, the party sees a great dark mass of buffalo in the grassy valley. Miller estimates two or three thousand in view, perhaps more beyond the visible bends.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>The valley herd at close range</h2><p>The buffalo have dark umber bodies, huge furry heads and long dark foreleg hair. An old bull has scarred flanks and upward-curving black horns.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>The first stand</h2><p>Miller kills the old bull, then keeps the herd circling under repeated fire. A wounded young cow eventually breaks the circle and the survivors flee. Miller reports 135 kills.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>The dwindling herd seeks the pass</h2><p>The buffalo move toward the pass while the hunters keep turning them back. By the twenty-fifth mountain day fewer than three hundred remain from roughly five thousand. The riders turn back six rushes shortly before the blizzard.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>No herd found after the storm</h2><p>Miller finds no buffalo on his post-storm search and supposes the remaining animals escaped before the pass was blocked. This is his explanation rather than an observed departure.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/bfeac3e32a8ca5.jpg">Open noncanonical illustration</a></p><p>Andrews examines buffalo remains with Miller.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/d49337ceea8020.jpg">Open noncanonical illustration</a></p><p>A representative buffalo with a heavy shaggy head and dark curved horns.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/9a4afa40618967.jpg">Open noncanonical illustration</a></p><p>The hunters see the grassy valley and its great herd from the pass.</p></details></noscript>
