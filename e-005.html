      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Introduction</h2><p>J. D. McDonald is a hide trader whom Andrews seeks on arriving in town, according to the hotel clerk.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Appearance and working habits</h2><p>McDonald has prominent blue eyes, thin black hair falling about his ears and a thin hand described as clawlike. Andrews finds him hunched over a ledger, hurriedly turning pages and cursing in his cluttered office.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Boston connections and the hide business</h2><p>McDonald remembers visiting the family of Benjamin Andrews in Boston before the war. He says he was a dry-goods clerk and attended Benjamin&#x27;s church and meetings hoping to find better employment. He now says he owns his company, having left Bates and Durfee four or five years earlier.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Boston connections and the hide business</h2><p>He describes a business that sends out buffalo-hunting parties, buys and sells hides, cures and tans them locally, and sells in St. Louis. His stated volume for the previous year is almost one hundred thousand hides.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>An offer and a warning</h2><p>McDonald offers Andrews work on his overdue paperwork. He predicts that a railroad will transform the town and says he has already claimed half a dozen lots. When Andrews expresses interest in hunters, McDonald warns that hunting will ruin him and forbids him to join McDonald&#x27;s own parties. He nevertheless recommends Miller, whom he says lives in a riverside dugout and frequents Jackson&#x27;s Saloon.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Miller&#x27;s contrasting account</h2><p>Miller says McDonald has tried for two years to recruit him to lead a party, and claims he pays hunters fifty cents per raw summer hide. Miller also places McDonald&#x27;s arrival four years earlier, conflicting with McDonald&#x27;s own one-year account.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>A way out of the expedition</h2><p>McDonald already knows that Andrews has paid Miller six hundred dollars. He says Miller has sought support for the venture for at least four years and doubts that the buffalo remain. He offers to buy the supplies and arrange a short local hunt instead. When Andrews refuses, McDonald still advises him to obey Miller&#x27;s judgment because he knows the country.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>A reported price for prime hides</h2><p>Miller reports that McDonald has agreed to pay four dollars per prime hide, allowing the party to sell locally.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Ruin in the bunkhouse</h2><p>The returning hunters find McDonald in the bunkhouse, having left his office deserted. He had believed them dead. He confirms the four-dollar hide agreement but says his money is tied up in thirty or forty thousand hides and the market has collapsed. He reports that the railroad is being laid fifty miles north and hunters now sell meat to it while leaving hides to rot.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Dreams and another invitation</h2><p>McDonald argues that life rests on lies and failed dreams, a judgment Andrews rejects. He intends to return to St. Louis or farther east and invites Andrews to work with him. Andrews does not yet decide.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Watching his property burn</h2><p>McDonald arrives distraught at his burning office. Andrews initially holds him back, but he pursues Miller, who stays just beyond his reach on horseback. McDonald explains that his distress is not the hides&#x27; value: they were his. He watches the destruction and eventually walks away.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Andrews declines inwardly</h2><p>Andrews resolves not to return home with McDonald. The decision is made privately before he rides away.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Manner and outlook</h2><p>McDonald warns Andrews against hunting while offering him work on his overdue paperwork.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 14</summary><p><a href="assets/126a606ad6611a.jpg">Open noncanonical illustration</a></p><p>The abandoned office amid unsold hides and neglected wagons.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 15</summary><p><a href="assets/f7c4b3abaca7eb.jpg">Open noncanonical illustration</a></p><p>Miller faces the others after feeding the hide stock and wagons to the fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 2</summary><p><a href="assets/fd48ad66fc51a2.jpg">Open noncanonical illustration</a></p><p>Andrews finds McDonald at work among his ledgers and papers.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/f92f9709265aa3.jpg">Open noncanonical illustration</a></p><p>An interpretation of J. D. McDonald.</p></details></noscript>
