      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Introduction</h2><p>William Andrews is a young traveler from Boston who arrives in Butcher’s Crossing seeking J. D. McDonald.</p></details><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Appearance</h2><p>William Andrews arrives in Butcher’s Crossing by coach from Ellsworth. He is slightly built and in his early twenties, with fair skin and neatly clipped light-brown hair. On the journey he wears nearly new yellowish-brown nankeen trousers and a sweat-soaked white linen shirt, with two days of blond beard growth.</p></details><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>A room and an intended visit</h2><p>After nearly two weeks traveling by coach and rail from Boston, he takes room fifteen at Butchers Hotel. He asks about J. D. McDonald and says he will visit him the following day. He shaves and bathes, then sleeps; nighttime sounds wake him into a disorienting darkness.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Family, college and the search for wildness</h2><p>Andrews introduces himself as Will and brings McDonald a letter from his father, Benjamin Andrews, whom he identifies as a Unitarian lay minister. He says he was in his third year at Harvard College before coming west.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Family, college and the search for wildness</h2><p>He tells McDonald that he wants to see and know the country. Inwardly, the wildness he seeks represents freedom, goodness, hope and vigor. He wants to talk with hunters, while remaining unsure whether to join a hunt. McDonald directs him toward Miller, but asks to be told before Andrews leaves.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Committing to the hunt</h2><p>Andrews tells Miller that he turned down McDonald because he did not want to be tied down. He says his desire to learn about the country is for himself.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Committing to the hunt</h2><p>Drawn into Miller&#x27;s plan for the Colorado valley, he agrees to join and help with skinning, despite saying he does not shoot a rifle. From a stated fund of a little over fourteen hundred dollars, he pays Miller six hundred to equip the expedition. Miller proposes a forty-percent share for Andrews.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Waiting and remembering Boston</h2><p>Andrews&#x27;s funds come from an uncle&#x27;s bequest. He left less than a month earlier, having grown up in his father&#x27;s house on Clarendon Street near Beacon and the Charles River. During Miller&#x27;s absence he watches the western horizon from his hotel room; the remembered family house feels distant and unstable.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Waiting and remembering Boston</h2><p>Francine invites him for a morning walk, but he moves stiffly beside her and later cannot recall what they said. Discussions with Hoge reveal that he has not read the Bible thoroughly. He remembers his father&#x27;s encouragement to read Emerson, his own escapes into fields and woods, and a sense of union with nature.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Keeping his word and seeking wilderness</h2><p>Andrews refuses McDonald&#x27;s offer to withdraw from the hunt, saying he has given his word. At the river crossing, he sees the hunt as a pretext for withdrawing from city life and imagines the river as a boundary between city and wilderness. His belief that nature can guide him remains his own understanding.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Preparations and resentment</h2><p>Andrews approves Schneider&#x27;s sixty-dollar monthly wage and acknowledges his own lack of skinning experience. Schneider&#x27;s treatment of Francine angers him.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>The visit to Francine&#x27;s room</h2><p>Francine invites Andrews upstairs. He learns that she prefers her life here to St. Louis, contrary to his pitying assumption. He tells her he is twenty-three. When she predicts the hunt will change him, he insists he will become himself.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>The visit to Francine&#x27;s room</h2><p>Although she says she wants him personally, Andrews becomes distressed during their intimate encounter by recalling Schneider&#x27;s words and imagining her other clients. He recoils, apologizes and flees, leaving her bewildered. He then wishes the remaining days before departure could be compressed and discarded.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>The first day&#x27;s riding</h2><p>The party departs on August 25. Andrews has never ridden for more than a few hours, and the first day brings heat, headache and severe saddle soreness. The wagon&#x27;s hard seat and dust prove even less comfortable. At the evening halt he struggles to dismount; Miller helps with his bedroll and reassures him. After food and the sounds of a passing wagon, he falls asleep.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Numbness and a changing body</h2><p>Andrews&#x27;s riding pain gives way to numbness, and daily traveling and camping become the chief structure of his life. His skin hardens, his hands brown, and his body grows leaner.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Confronting the buffalo remains</h2><p>On the fourth day Miller shows him scattered buffalo bones. Andrews cannot combine the remains with remembered engravings to imagine the living animal. Even when he later sees a distant small herd, he cannot distinguish individual forms or movement.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Trust during the water crisis</h2><p>Andrews initially defers on the route because he does not know the country, then sides with Miller when Schneider urges a turn toward the Arkansas. Thirst and the featureless prairie terrify him. He becomes intermittently delirious and panics when briefly separated from the party at night. When water is found, he helps hold the wagon brake while Hoge frees the oxen.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>The mountain climb</h2><p>The mountains appear on the fourteenth day, with four more days needed to reach the foothills. Andrews starts the climb eagerly but collapses while pushing the wagon; Miller attributes this to the thin air. Andrews learns a slower gait and standing rests, then cuts his palms during the final ascent. Beyond the pass he sees the valley and its herd, and the party descends before dark.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Learning the camp work</h2><p>At the valley camp, Andrews helps Hoge shelter the powder and cuts firewood with Schneider. He watches Miller casting ammunition, then learns to sharpen and use his new knives under Schneider&#x27;s supervision. Testing an edge cuts his thumb. Despite the cold, he sleeps soundly.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>The first stand and failed hides</h2><p>Andrews assists Miller by cleaning and cooling the rifles during the first sustained slaughter. His knees become raw and smoke and heat hurt him; he begins to see Miller as an automaton and feels estranged from himself. Schneider demonstrates skinning, but Andrews ruins two hides. Sent back to camp with a calf, he skins it more successfully with Hoge&#x27;s help, then struggles to gut it.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Revulsion and the imagined self</h2><p>After Miller and Schneider eat raw liver, Andrews vomits, then washes himself and his clothing at the spring; his boots remain stained. Yet the cooked meat later makes him hungry. That night his bearded face feels unfamiliar. Thinking of Francine, he tentatively connects his flight from her and his revulsion at the butchered buffalo with the destruction of the selves he had imagined for them.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Skill, numbness and confinement</h2><p>Andrews becomes able to skin one buffalo to Schneider&#x27;s two. He kills four in his own stand and feels little beyond the recoil; later he eats raw liver following Miller&#x27;s claim about preventing illness. He pays Schneider sixty dollars. As the hunt continues, the world beyond the valley grows unreal to him.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Lost in the blizzard</h2><p>After helping turn back six buffalo rushes, Andrews is caught in the blizzard. Frightened horses drag him away from the abandoned wagon; he loses his bearings and follows shouts back to Miller. Sheltering under snow for the prolonged storm, he thinks of Francine as warmth he once pushed away.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Winter endurance and snow-blindness</h2><p>Andrews helps construct the winter shelter and shares the improvised snow-blinders, snowshoes, hide boots and robes. He recovers Hoge&#x27;s soaked Bible. He can now remember Francine without shame, wondering at his former conduct. A walk without his snow-blinders leaves him unable to see; he heals in the shelter for nearly three days. As winter passes he continues paying Schneider, though time has lost meaning for him.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Departure and a refused gift</h2><p>Andrews prepares smoked trout and venison under Hoge&#x27;s direction. When departure is finally announced, elation gives way to a curious sadness. He offers Schneider a share beyond his wages, but Schneider refuses.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Loss at the mountain river</h2><p>Andrews and Schneider briefly splash each other like children at the river. Andrews crosses ahead of the wagon. A log strikes Schneider&#x27;s horse; Schneider falls and is hit by its hoof, while the horse and log overturn the wagon. The team, wagon and hides are swept away. Miller says Schneider is dead and refuses a search. Andrews sees his sodden hat trapped across the river, then follows Miller and Hoge away.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Returning to a diminished town</h2><p>Andrews returns in late May after ten days across the plains with Miller and Hoge. At the hotel he takes room seventeen, discards his clothes, shaves his long beard and cuts his hair unevenly. His pale shaved skin contrasts with his dark forehead and cheeks; he wears new black broadcloth trousers and a heavy blue shirt.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Refusing McDonald&#x27;s verdict</h2><p>McDonald reports the hide-market collapse and invites Andrews to leave and work with him. Andrews rejects his assertion that the hunt brought nothing, though he cannot explain his gain, and leaves the offer undecided.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Returning to Francine</h2><p>Francine believed him dead. She notices his harder hands and older face; Andrews apologizes for his earlier flight. She says he has changed enough to return and asks him to stay as someone different from her other visitors. He joins her after she extinguishes the lamp.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Restlessness with Francine</h2><p>Andrews spends five days and nights with Francine. He feels detached from his own intimacy, gradually turns his attention to her and then grows restless, settling his hotel bill and wandering town. Hoge speaks as though the hunt still lies ahead and denies death; the encounter leaves Andrews shaking. He tries to explain to Francine the terror he associates with the expedition and Schneider&#x27;s loss. He anticipates leaving her, remembering her without truly knowing her.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Witnessing the fire</h2><p>Andrews wakes to McDonald&#x27;s burning office and sees Miller feeding hides and wagons to the flames. He initially restrains McDonald, who then pursues Miller futilely. When Andrews attempts to speak afterward, Miller rides away and his horse catches Andrews&#x27;s shoulder.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Leaving at dawn</h2><p>After the other watchers leave, Andrews remains among the burned hides, then returns to Francine. Seeing her asleep, he feels an unguarded pity and rejects the quality of his earlier pity. He recognizes vanity in his passions for her and for a fixed self discovered in the wilderness.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Leaving at dawn</h2><p>Remembering his father, he resolves not to return home with McDonald. He leaves most of his remaining money for Francine, keeping two bills, and departs without waking her. He pays the stableman, retrieves his horse, passes the ruins and crosses the river. He rides into open country without knowing his destination beyond a general direction.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Manner and outlook</h2><p>He seeks knowledge of the country and inwardly associates wildness with freedom, hope and renewal.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/5c50428b3cf1a8.jpg">Open noncanonical illustration</a></p><p>William Andrews at the beginning of his journey.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/429f8a35b5ccff.jpg">Open noncanonical illustration</a></p><p>Andrews approaches the settlement on the coach from Ellsworth.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 11</summary><p><a href="assets/96124d84e4f9f4.jpg">Open noncanonical illustration</a></p><p>The men shelter in lashed buffalo hides while Schneider keeps apart.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/bfeac3e32a8ca5.jpg">Open noncanonical illustration</a></p><p>Andrews examines buffalo remains with Miller.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 6</summary><p><a href="assets/e98812246071b6.jpg">Open noncanonical illustration</a></p><p>The men rest beside their first evening fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 10</summary><p><a href="assets/4ad911d4639e75.jpg">Open noncanonical illustration</a></p><p>Andrews tends the spare rifle beside Miller during the prolonged stand.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 15</summary><p><a href="assets/f7c4b3abaca7eb.jpg">Open noncanonical illustration</a></p><p>Miller faces the others after feeding the hide stock and wagons to the fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 2</summary><p><a href="assets/fd48ad66fc51a2.jpg">Open noncanonical illustration</a></p><p>Andrews finds McDonald at work among his ledgers and papers.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 16</summary><p><a href="assets/46ecb1e13a604f.jpg">Open noncanonical illustration</a></p><p>Andrews rides into open country without a settled destination.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 14</summary><p><a href="assets/0a539ee030871e.jpg">Open noncanonical illustration</a></p><p>Andrews, Miller and Hoge after washing and trimming their hair on returning to town.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 4</summary><p><a href="assets/1fa999a7775987.jpg">Open noncanonical illustration</a></p><p>Andrews pauses at the river west of town.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 3</summary><p><a href="assets/8dd0d89223abec.jpg">Open noncanonical illustration</a></p><p>Andrews supplies the money for the proposed hunt.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 13</summary><p><a href="assets/65f0d0ff9c7513.jpg">Open noncanonical illustration</a></p><p>Schneider’s hat caught between rocks after the river disaster.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/9a4afa40618967.jpg">Open noncanonical illustration</a></p><p>The hunters see the grassy valley and its great herd from the pass.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/324d9c9532fcb0.jpg">Open noncanonical illustration</a></p><p>Miller uses the remaining water to wet an ox mouth while Andrews and Schneider hold its horns.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/c72cedb32cc0d9.jpg">Open noncanonical illustration</a></p><p>The journey changes the riders’ appearance and bearing.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 12</summary><p><a href="assets/0171132522f379.jpg">Open noncanonical illustration</a></p><p>The winter lean-to and improvised hide clothing beside the campfire.</p></details></noscript>
