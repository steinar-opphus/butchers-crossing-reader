      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Introduction</h2><p>Fred Schneider joins the expedition as its skinner, having worked with Miller before.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Appearance</h2><p>Fred Schneider arrives as the expedition&#x27;s skinner, having previously worked with Miller. He is medium-height and thickly built, with a round face, light-brown stubble and wide blue eyes under heavy lids. His straight brown hair bristles beneath a flat-brimmed hat; he wears a red-checked shirt and a small pistol high at his waist. He gives Andrews an impression of watchful guardedness.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Wages instead of shares</h2><p>Schneider initially rejects the Colorado venture, questioning whether the buffalo remain and challenging Miller&#x27;s estimates of the oxen&#x27;s daily progress. He agrees to sixty dollars a month instead of a share, an arrangement Andrews approves and Miller accepts.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Treatment of Francine</h2><p>Schneider&#x27;s coarse approach to Francine angers Andrews.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Lowered hopes and withdrawal</h2><p>Schneider rides apart, chews tobacco and speaks little. He says hunters must accept the small herds that remain and keeps his hopes modest. As his beard grows and his skin darkens, he withdraws further from the other men.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Challenging the dry-country route</h2><p>Schneider urges a turn toward the Arkansas and points to drought. Miller counters that their course has put the river too far away for the thirsty stock. Schneider also proposes unloading ammunition to lighten the wagon, but Miller refuses.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Doubts at the railway</h2><p>When the party encounters railway tracks, Schneider says he has never seen large buffalo herds where a railroad has been established for years. His doubt remains a claim, later qualified by the herd actually visible in the valley.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Teaching the novice</h2><p>Schneider shows Andrews how to sharpen his knives and explains their different uses. He asks Miller to start the hunt slowly while Andrews learns skinning.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Workload and the ruined hides</h2><p>Schneider dreads the work created by Miller&#x27;s stand and asks him to stop. Miller threatens him if he frightens the buffalo. Schneider demonstrates skinning to Andrews, then sends him to practice on a calf at camp after two ruined hides. He and Miller eat raw liver; later Miller cuts off his intrusive questioning about Francine. Both return to skinning after dark.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Wages and warnings</h2><p>After two weeks Schneider proposes leaving, but Miller refuses. Schneider demands his monthly wage, and Andrews pays him sixty dollars. Immediately before the snow, he senses that something is wrong and urges departure.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Refusing shared shelter</h2><p>At the storm-bound camp Schneider blames the decisions he has followed and insists he will take care of himself. He refuses Miller&#x27;s shared shelter and lashes his own hides together.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>A rejected route out</h2><p>Schneider survives his separate shelter, suspecting frostbite. He asks Miller for a route over the mountains alone, but Miller refuses, citing danger and the need for his labor.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>Withdrawal through the winter</h2><p>Schneider sleeps in the common shelter but increasingly spends his days alone, speaking to himself. He again wears his small pistol and sometimes touches it as he mutters. He counts days with notches on a pine branch and continues collecting monthly wages from Andrews.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Impatience at the thaw</h2><p>Schneider reports walking through the remaining deep snow, but Miller refuses departure because of the danger of collapse. He warns that the overloaded wagon may tip and refuses Andrews&#x27;s offer of an extra share beyond his agreed wages.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Death during the crossing</h2><p>At the river, Schneider splashes playfully with Andrews and says he plans to go on to St. Louis. He declines to guide the oxen across. A floating log strikes his horse; as both fall, a hoof hits him on the head. Miller says he is dead and a search would be useless. Andrews later sees Schneider&#x27;s sodden hat trapped between rocks.</p></details><details><summary>Butcher&#x27;s Crossing · 5</summary><h2>Manner and outlook</h2><p>His guarded manner makes Andrews think he is watching closely while trying not to reveal it.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 11</summary><p><a href="assets/96124d84e4f9f4.jpg">Open noncanonical illustration</a></p><p>The men shelter in lashed buffalo hides while Schneider keeps apart.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 5</summary><p><a href="assets/b14242a12afac1.jpg">Open noncanonical illustration</a></p><p>An interpretation of Fred Schneider.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 13</summary><p><a href="assets/65f0d0ff9c7513.jpg">Open noncanonical illustration</a></p><p>Schneider’s hat caught between rocks after the river disaster.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 5</summary><p><a href="assets/f242844f230893.jpg">Open noncanonical illustration</a></p><p>The outfit returns from Ellsworth in a cloud of dust.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 7</summary><p><a href="assets/c72cedb32cc0d9.jpg">Open noncanonical illustration</a></p><p>The journey changes the riders’ appearance and bearing.</p></details></noscript>
