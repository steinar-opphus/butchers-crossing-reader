      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>The settlement</h2><p>Butcher’s Crossing consists of six rough frame buildings along a narrow dirt street, with tents beyond them on both sides. Jackson’s Saloon is a long, two-story building with a shaded front; Butchers Hotel is painted white with red trim.</p></details><details><summary>Butcher&#x27;s Crossing · 1</summary><h2>Arrival by coach</h2><p>William Andrews arrives on the coach from Ellsworth.</p></details><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>McDonald&#x27;s hopes for growth</h2><p>McDonald says the settlement had only three tents and a dugout when he arrived a year earlier. He predicts that a railroad will bring growth, and says he has staked out half a dozen lots. These are his account and expectations.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>A nearly deserted return</h2><p>The survivors return in late May to a nearly deserted street and neglected buildings. McDonald reports collapse of the hide market and a railroad route fifty miles north of town.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>The final departure</h2><p>At dawn Andrews imagines the declining town eventually disappearing as buildings are dismantled and prairie grass reclaims the road; this remains his projection. He retrieves his horse, passes the burned office and crosses the river into open country.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/429f8a35b5ccff.jpg">Open noncanonical illustration</a></p><p>Andrews approaches the settlement on the coach from Ellsworth.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 1</summary><p><a href="assets/61b867c0223587.jpg">Open noncanonical illustration</a></p><p>An interpretation of the small settlement and its main street.</p></details></noscript>
