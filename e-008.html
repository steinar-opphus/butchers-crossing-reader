      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 2</summary><h2>Shack and working space</h2><p>McDonald works in a small flat-roofed shack near pole fences and empty wagons. Books, papers and ledgers clutter the room; Andrews finds him hunched over a rough table, turning ledger pages in haste.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Abandoned among the hides</h2><p>On the hunters&#x27; return, hide bales crowd the office and neglected wagons stand or lie overturned nearby. Inside, papers and ledgers litter the floor and the chair is overturned. McDonald is found instead in the bunkhouse.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Destroyed by fire</h2><p>Andrews wakes to see the office burning. Miller feeds hide bales and loaded wagons into the flames; Hoge identifies it as Miller&#x27;s fire. The destruction continues for nearly an hour.</p></details><details><summary>Butcher&#x27;s Crossing · 16</summary><h2>Ashes at dawn</h2><p>After the others leave, Andrews kicks a charred bale that collapses to ash. He later rides past the ruins on leaving town.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 14</summary><p><a href="assets/126a606ad6611a.jpg">Open noncanonical illustration</a></p><p>The abandoned office amid unsold hides and neglected wagons.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 15</summary><p><a href="assets/f7c4b3abaca7eb.jpg">Open noncanonical illustration</a></p><p>Miller faces the others after feeding the hide stock and wagons to the fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 2</summary><p><a href="assets/fd48ad66fc51a2.jpg">Open noncanonical illustration</a></p><p>Andrews finds McDonald at work among his ledgers and papers.</p></details></noscript>
