      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>River and trail</h2><p>The expedition reaches the Smoky Hill around midday on its first day. Miller says the trail follows the river toward Colorado Territory. The track is narrow, worn bare by hooves and wagon wheels, with occasional deep ruts. Miller identifies a packed route crossing it as a buffalo watering place.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>The trail&#x27;s end</h2><p>The party reaches the end of the Smoky Hill Trail on the sixth day of travel.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 6</summary><p><a href="assets/e98812246071b6.jpg">Open noncanonical illustration</a></p><p>The men rest beside their first evening fire.</p></details></noscript>
