      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Introduction</h2><p>Charley Hoge is Miller&#x27;s prospective camp man, praised by Miller for his work and described by him as a Bible reader.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Appearance</h2><p>Charley Hoge is a sharp-faced, narrow-shouldered man with gray beard stubble and small gray eyes. At Jackson&#x27;s Saloon, he thrusts his wrist stump toward Andrews and laughs at the startled reaction; his right hand is missing at the wrist.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Religion and whisky</h2><p>Miller describes Hoge as a Bible reader. Hoge condemns Francine in religious terms. Whisky calms him after he begins shivering during his account of the lost hand.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>The blizzard and the proposed return</h2><p>Hoge dates the loss to the winter of 1862. He recalls a fall that knocked him unconscious in a Colorado blizzard, after which his exposed hand froze and deteriorated. In his account, Miller eventually persuaded him to allow its amputation.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>The blizzard and the proposed return</h2><p>Hoge refuses to return on the proposed expedition, but Miller insists he will come and praises his ability as a camp man. Miller also gives him money to live on during the shopping trip to Ellsworth.</p></details><details><summary>Butcher&#x27;s Crossing · 4</summary><h2>Conversion and scriptural conversation</h2><p>Hoge tells Andrews that a traveling Kansas City preacher converted him and gave him his Bible. He worries that its buffalo-blood stains may be sacrilegious. Andrews reassures him, but admits he has not read the Bible thoroughly; Hoge then shifts from respectful discussion to evangelizing.</p></details><details><summary>Butcher&#x27;s Crossing · 6</summary><h2>Driving and making camp</h2><p>Hoge drives the expedition wagon and takes the thirsty oxen to water in yoked pairs. At the first camp, he digs a fire pit by combining his hand, foot and the bend of his other arm to lever the shovel. He prepares coffee, beans and side pork.</p></details><details><summary>Butcher&#x27;s Crossing · 7</summary><h2>Hymns, scripture and whisky</h2><p>Hoge sings while driving and reads his Bible by the dying campfire. His skin reddens rather than browns, and he continues reading and drinking whisky regularly on the wagon.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Thirst and the river release</h2><p>Hoge expresses faith that God will lead the party to water. Miller makes the men take small swallows of Hoge&#x27;s whisky during the shortage. At the eventual stream, Andrews holds the brake while Hoge frees the oxen.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Handling the mountain turn</h2><p>Hoge repeatedly backs and angles the wagon around a sharp bend beside a deep gully during the ascent.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Arranging the valley camp</h2><p>Hoge and Andrews make a small canvas powder shelter. Hoge hangs his cooking utensils on a bough between two pines. Miller plans for him to collect hides by wagon and bring them to the main camp for baling.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>Corral and calf scaffold</h2><p>Hoge builds a roughly hexagonal corral and helps Andrews suspend a calf from an aspen tripod. He supplies an old Ballard rifle whose damaged stock is bound with wire during the hunt. Miller explains that Hoge uses strychnine-poisoned meat against wolves.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Cold weather and terror</h2><p>Hoge gathers dried hides by wagon. As the weeks pass he drinks more, builds hotter fires and beds down beneath softened hides. When snow begins he accuses Miller of promising they would leave before it came. He rides behind Miller to camp and is helped into a hide shelter.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>The rescued Bible</h2><p>Hoge emerges from the storm disoriented, guided by Miller. Miller rations recovered whisky to him and assumes much of his camp work. Andrews finds his soaked Bible in the snow; Hoge dries it page by page, then spends idle days tracing its blurred lines. He angrily declines Andrews&#x27;s request to read aloud.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Guiding the team across</h2><p>Hoge directs the preparation of smoked provisions and treats the hides left in the valley with his last strychnine. At the river, he volunteers to guide the team while riding a lead ox. After Schneider&#x27;s fatal accident, Hoge condemns his conduct and calls the loss God&#x27;s will; this is Hoge&#x27;s interpretation.</p></details><details><summary>Butcher&#x27;s Crossing · 14</summary><h2>Gaunt on returning</h2><p>After his beard is clipped, Hoge&#x27;s face shows deeply sunken cheeks, wasted eyes and a slack mouth beneath gray stubble. He returns with Miller and Andrews in late May.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>The hunt as an unfinished future</h2><p>Hoge tells Andrews that Miller is preparing their expedition. When reminded of Schneider&#x27;s death, he says nobody dies and the Lord will provide.</p></details><details><summary>Butcher&#x27;s Crossing · 15</summary><h2>Following Miller from the blaze</h2><p>At the burning office, Hoge identifies the fire as Miller&#x27;s. After Miller rides away, Hoge follows him into the dark.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 6</summary><p><a href="assets/e98812246071b6.jpg">Open noncanonical illustration</a></p><p>The men rest beside their first evening fire.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 3</summary><p><a href="assets/917babcc96a23e.jpg">Open noncanonical illustration</a></p><p>An interpretation of Charley Hoge.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 4</summary><p><a href="assets/a51a474a2f0bba.jpg">Open noncanonical illustration</a></p><p>An interpretation of the worn Bible Hoge shows Andrews.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 14</summary><p><a href="assets/0a539ee030871e.jpg">Open noncanonical illustration</a></p><p>Andrews, Miller and Hoge after washing and trimming their hair on returning to town.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 9</summary><p><a href="assets/bdb08a0c583fb2.jpg">Open noncanonical illustration</a></p><p>The camp beside the spring, with its boulder-backed fire and pine-needle bedding.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 12</summary><p><a href="assets/d1701cbcb3bcad.jpg">Open noncanonical illustration</a></p><p>Hoge dries the Bible recovered from the snow.</p></details></noscript>
