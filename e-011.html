      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>Appearance</h2><p>Miller describes a secluded valley in the Colorado mountains that he says he found in autumn 1863, following a hard-packed buffalo trail. He estimates that three or four thousand buffalo were visible, with more beyond his view, and describes their autumn fur as thicker than winter fur on plains buffalo. He says he has not returned since the discovery.</p></details><details><summary>Butcher&#x27;s Crossing · 3</summary><h2>A proposed destination</h2><p>Miller proposes a four-man expedition to hunt there under his command; Andrews supplies six hundred dollars for the venture.</p></details><details><summary>Butcher&#x27;s Crossing · 8</summary><h2>Reached beyond the pass</h2><p>The party reaches a long, narrow, flat valley with lush grass winding among the mountains. A large buffalo herd is visible; Miller estimates two or three thousand in sight and possibly more farther along. This observation establishes the herd&#x27;s presence, while the count remains Miller&#x27;s estimate. They descend to the valley floor before dark.</p></details><details><summary>Butcher&#x27;s Crossing · 9</summary><h2>Camp beside the spring</h2><p>The men establish camp by a spring feeding a narrow stream. A huge creviced boulder backs the fire; their beds use branches and pine needles. Miller says there is a lake a few miles south where the buffalo drink. He estimates the valley&#x27;s length at twenty or twenty-five miles and its width at up to four or five miles, and claims the hunters&#x27; pass is its only buffalo exit.</p></details><details><summary>Butcher&#x27;s Crossing · 10</summary><h2>The first day of slaughter</h2><p>The valley is identified as lying in Colorado&#x27;s Rocky Mountains. Miller holds the first herd in a circling stand until a wounded cow disrupts it. He counts 135 dead buffalo. Hoge completes a roughly hexagonal corral at camp.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Autumn work and a blocked escape</h2><p>Shorter days bring afternoon rain and growing cold. By the twenty-fifth mountain day, fewer than three hundred of the roughly five thousand buffalo remain; the hunters turn back six rushes toward escape.</p></details><details><summary>Butcher&#x27;s Crossing · 11</summary><h2>Two days and three nights of snow</h2><p>A blizzard catches the party away from camp. At their return, hide stacks have toppled and loose skins blown away. The men shelter beneath hides and snowdrifts for two days and three nights.</p></details><details><summary>Butcher&#x27;s Crossing · 12</summary><h2>A winter home</h2><p>After the storm the valley lies under brilliant deep snow. Miller reports the pass inaccessible and estimates six to eight months until thaw. The men build a pine-frame lean-to, shoulder-high at the front and about a foot high behind, walled and floored with hides. Loose hides close the front. They make snow-blinders, snowshoes, hide boots and robes for winter work.</p></details><details><summary>Butcher&#x27;s Crossing · 13</summary><h2>Thaw and departure</h2><p>Thaw begins in late March and early April. All eight oxen and the three thin horses survive the winter. Miller finally announces departure in late April. He estimates more than 3,000 hides will remain for a later trip; Hoge treats the remaining bales with his last strychnine.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 11</summary><p><a href="assets/96124d84e4f9f4.jpg">Open noncanonical illustration</a></p><p>The men shelter in lashed buffalo hides while Schneider keeps apart.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 13</summary><p><a href="assets/33819d6e12312c.jpg">Open noncanonical illustration</a></p><p>An interpretation of the towering hide load prepared for the descent.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 9</summary><p><a href="assets/bdb08a0c583fb2.jpg">Open noncanonical illustration</a></p><p>The camp beside the spring, with its boulder-backed fire and pine-needle bedding.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 8</summary><p><a href="assets/9a4afa40618967.jpg">Open noncanonical illustration</a></p><p>The hunters see the grassy valley and its great herd from the pass.</p></details><details><summary>Illustration · Butcher&#x27;s Crossing · 12</summary><p><a href="assets/0171132522f379.jpg">Open noncanonical illustration</a></p><p>The winter lean-to and improvised hide clothing beside the campfire.</p></details></noscript>
